spring:
  application:
    name: kairos

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

kairos:
  risk-calculator:
    climate-weight: 0.7
    occurrence-weight: 0.3
    occurrence-smoothing-factor: 5.0
    thresholds:
      rain:
        medium: 5.0
        high: 21.0
        critical: 50.0
      wind:
        medium: 30.0
        high: 51.0
        critical: 80.0

server:
  port: 8081

logging:
  level:
    root: INFO
    br.com.artheus.kairos: DEBUG

config:
  scheduler:
    plans-interval: "3600000" # 1 hour
    climate-interval: "900000" # 15 minutes